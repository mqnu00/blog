name: Test Timezone

on:
  push:
    paths:
      - 'blog/.vitepress/config.mts'
      - 'test-rss-timezone.mjs'
  push:
    branches:
      - timezone-test  # 你开发用的分支

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 'lts/*'
      
      - name: Install dependencies
        run: npm install
      
      - name: Test timezone
        run: npm run test:timezone