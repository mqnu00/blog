query GetDiscussionCount($owner: String!, $repo: String!) {
    repository(owner: $owner, name: $repo) {
        discussions {
            totalCount
        }
    }
}

query GetDiscussionByNumber($owner: String!, $repo: String!, $number: Int!, $first: Int!, $after: String) {
    repository(owner: $owner, name: $repo) {
        discussion(number: $number) {
            id
            number
            title
            body
            createdAt
            author {
                login
            }
            comments(first: $first, after: $after) {
                totalCount,
                pageInfo {
                    hasNextPage
                    endCursor
                },
                nodes {
                    id
                    body
                    createdAt
                    author {
                        login
                    }
                }
            }
        }
    }
}

query GetDiscussionCommentReply($commentId: ID!, $first: Int = 40, $after: String) {
    node(id: $commentId) {
        ... on DiscussionComment {
            replies(first: $first, after: $after) {
                nodes {
                    body
                    author {
                        login
                    }
                    createdAt
                    url
                }
                pageInfo {
                    endCursor
                    hasNextPage
                }
                totalCount
            }
        }
    }
}

